<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>发文助手</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<meta name="theme-color" content="#3563e9">
<link rel="stylesheet" href="assets/style.css">
<script src="config.js"></script>
<style>
  .tool { max-width: 980px; margin: 0 auto; padding: 0 20px 60px; }
  .tool-head { padding: 40px 0 6px; }
  .tool-head h1 { margin: 0 0 8px; font-size: 27px; letter-spacing: -.02em; }
  .tool-head p { margin: 0; color: var(--text-soft); font-size: 15px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; margin-top: 28px; align-items: start; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; color: var(--text-soft); margin-bottom: 5px; }
  .field .hint { color: var(--text-faint); font-size: 12px; }
  input[type=text], input[type=date], textarea {
    width: 100%; font-family: inherit; font-size: 14.5px; color: var(--text);
    background: var(--bg-soft); border: 1px solid var(--border);
    border-radius: 8px; padding: 9px 12px; line-height: 1.7;
  }
  textarea { resize: vertical; }
  #body { min-height: 380px; font-family: var(--mono); font-size: 13.5px; }
  input:focus, textarea:focus { outline: none; border-color: var(--accent); background: var(--bg); }
  .row { display: flex; gap: 12px; align-items: flex-start; }
  .row .field { flex: 1; min-width: 0; }
  .field label { white-space: nowrap; }
  .btns { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; align-items: center; }
  .btn {
    font-family: inherit; font-size: 14px; padding: 9px 18px; cursor: pointer;
    border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: #fff;
  }
  .btn.ghost { background: transparent; color: var(--text-soft); border-color: var(--border); }
  .btn.ghost:hover { color: var(--text); border-color: var(--text-faint); }
  .btn:disabled { opacity: .45; cursor: default; }
  .msg { font-size: 13px; color: var(--text-faint); }
  .msg.err { color: #c0392b; }
  .msg.ok { color: #2a9d8f; }
  .pane-preview { position: sticky; top: 78px; }
  .preview-head {
    font-size: 12px; letter-spacing: .06em; text-transform: uppercase;
    color: var(--text-faint); margin-bottom: 10px;
  }
  .preview {
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 18px 20px; min-height: 380px; background: var(--bg-soft);
  }
  .steps { border-top: 1px solid var(--border); margin-top: 34px; padding-top: 22px; font-size: 14.5px; color: var(--text-soft); }
  .steps ol { padding-left: 22px; margin: 10px 0 0; }
  .steps li { margin: 7px 0; }
  .steps code { font-family: var(--mono); font-size: .88em; background: var(--bg-code); border: 1px solid var(--border); border-radius: 5px; padding: 1px 5px; }
  @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } .preview { min-height: 0; } }
</style>
</head>
<body data-page="tool">

<header class="nav" id="nav"></header>

<main class="tool">
  <div class="tool-head">
    <h1>发文助手</h1>
    <p>填好表单，点一下就生成 <code>文章.md</code> 和更新后的 <code>index.json</code>，不用手动改 JSON。这个页面只在本地生成文件，不会改动任何东西。</p>
  </div>

  <div class="grid">
    <section>
      <div class="field">
        <label for="title">标题</label>
        <input type="text" id="title" placeholder="比如：为什么我又把博客重写了一遍">
      </div>

      <div class="row">
        <div class="field">
          <label for="slug">文件名 slug <span class="hint">英文、数字、-</span></label>
          <input type="text" id="slug" placeholder="why-i-rewrote-my-blog">
        </div>
        <div class="field" style="max-width:180px">
          <label for="date">发布日期</label>
          <input type="date" id="date">
        </div>
      </div>

      <div class="field">
        <label for="summary">摘要 <span class="hint">显示在首页列表，可留空</span></label>
        <input type="text" id="summary" placeholder="一句话说清这篇写了什么">
      </div>

      <div class="field">
        <label for="tags">标签 <span class="hint">多个用逗号分隔</span></label>
        <input type="text" id="tags" placeholder="随笔, 建站">
      </div>

      <div class="field">
        <label><input type="checkbox" id="draft"> 存为草稿（网站上暂不显示）</label>
      </div>

      <div class="field">
        <label for="body">正文 <span class="hint">Markdown，不用写一级标题</span></label>
        <textarea id="body" placeholder="开始写…&#10;&#10;## 小标题&#10;&#10;正文段落。**加粗**、*斜体*、`代码`、[链接](https://example.com)。"></textarea>
      </div>

      <div class="btns">
        <button class="btn" id="gen">生成并下载两个文件</button>
        <button class="btn ghost" id="copyJson">只复制 JSON 条目</button>
      </div>
      <div class="msg" id="msg" style="margin-top:10px"></div>
    </section>

    <section class="pane-preview">
      <div class="preview-head">实时预览</div>
      <div class="preview prose" id="preview"></div>
    </section>
  </div>

  <div class="steps">
    <strong style="color:var(--text)">生成之后怎么用</strong>
    <ol>
      <li>浏览器会下载两个文件：<code>你的slug.md</code> 和 <code>index.json</code>。</li>
      <li>把 <code>.md</code> 文件放进网站的 <code>posts/</code> 文件夹。</li>
      <li>用下载的 <code>index.json</code> 覆盖 <code>posts/index.json</code>。</li>
      <li>双击 <code>本地预览.bat</code> 看一眼，没问题就把这两个文件传到 GitHub。</li>
    </ol>
  </div>

  <footer class="foot" id="foot"></footer>
</main>

<script src="assets/markdown.js"></script>
<script src="assets/app.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var msg = $("msg");
  var existing = [];

  // 默认日期 = 今天
  var t = new Date();
  $("date").value = t.getFullYear() + "-" +
    String(t.getMonth() + 1).padStart(2, "0") + "-" +
    String(t.getDate()).padStart(2, "0");

  fetch("posts/index.json", { cache: "no-store" })
    .then(function (r) { return r.json(); })
    .then(function (list) {
      existing = list;
      say("已读到现有的 " + list.length + " 篇文章，生成时会自动合并。", "ok");
    })
    .catch(function () {
      say("读不到 posts/index.json —— 请用 本地预览.bat 打开本页面，否则生成的 index.json 会丢掉已有文章。", "err");
    });

  function say(text, cls) { msg.textContent = text; msg.className = "msg " + (cls || ""); }

  // 标题 → slug 兜底（只对英文有效，中文标题请自己填）
  $("title").addEventListener("blur", function () {
    if ($("slug").value.trim()) return;
    var s = $("title").value.trim().toLowerCase()
      .replace(/[^\w\s-]/g, "").replace(/\s+/g, "-").replace(/-+/g, "-");
    if (s) $("slug").value = s;
  });

  var timer;
  $("body").addEventListener("input", function () {
    clearTimeout(timer);
    timer = setTimeout(function () {
      $("preview").innerHTML = window.MD.render($("body").value).html;
    }, 200);
  });

  function collect() {
    var title = $("title").value.trim();
    var slug = $("slug").value.trim();
    var date = $("date").value;
    if (!title) { say("标题不能为空。", "err"); return null; }
    if (!/^[a-zA-Z0-9-]+$/.test(slug)) { say("slug 只能用英文字母、数字和连字符，比如 my-first-post。", "err"); return null; }
    if (!date) { say("请选择发布日期。", "err"); return null; }
    if (!$("body").value.trim()) { say("正文还是空的。", "err"); return null; }

    var entry = {
      slug: slug,
      title: title,
      date: date,
      summary: $("summary").value.trim(),
      tags: $("tags").value.split(/[,，]/).map(function (s) { return s.trim(); }).filter(Boolean)
    };
    if ($("draft").checked) entry.draft = true;
    return entry;
  }

  function download(name, text, type) {
    var blob = new Blob([text], { type: (type || "text/plain") + ";charset=utf-8" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }

  $("gen").addEventListener("click", function () {
    var e = collect();
    if (!e) return;
    var merged = existing.filter(function (p) { return p.slug !== e.slug; }).concat([e]);
    merged.sort(function (a, b) { return (b.date || "").localeCompare(a.date || ""); });
    download(e.slug + ".md", $("body").value.trim() + "\n", "text/markdown");
    setTimeout(function () {
      download("index.json", JSON.stringify(merged, null, 2) + "\n", "application/json");
    }, 350);
    say("已生成 " + e.slug + ".md 和 index.json，按下面四步放进网站即可。", "ok");
  });

  $("copyJson").addEventListener("click", function () {
    var e = collect();
    if (!e) return;
    var text = JSON.stringify(e, null, 2);
    var done = function () { say("JSON 条目已复制，粘贴到 posts/index.json 的数组最前面（记得加逗号）。", "ok"); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () { say(text, ""); });
    } else { say(text, ""); }
  });
})();
</script>
</body>
</html>
